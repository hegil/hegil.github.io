<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드공방 — 프로그래밍 언어 학습</title>
<meta name="description" content="완전 처음 배우는 사람을 위한 프로그래밍 언어 학습 페이지. 무한 연습 문제 포함.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b6cf0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand" id="brandHome" role="button" tabindex="0">코드<span>공방</span></div>
    <nav class="langbar" id="langbar" aria-label="학습 언어 선택"></nav>
    <div class="auth-area" id="authArea"></div>
    <button class="icon-btn" id="theme" type="button" aria-label="밝은/어두운 테마 전환">◐</button>
  </div>
</header>

<div class="wrap" id="wrap">
  <aside id="sidebar" hidden>
    <div class="card">
      <div class="side-title">단원</div>
      <ul class="unit-list" id="units"></ul>
      <div id="tierChallenge" class="tier-challenge"></div>
    </div>
    <div class="card card-pad">
      <div class="muted">이 언어의 진도</div>
      <div class="progress-num" id="pct">0%</div>
      <div class="bar"><i id="barfill" style="width:0%"></i></div>
      <div class="muted" id="progress-note" style="margin-top:10px"></div>
      <button class="reset" id="reset" type="button">진도 초기화</button>
      <div class="tip-line" id="sidebarTip"></div>
    </div>
  </aside>

  <main id="main"></main>
</div>

<footer>
  "다음 문제"를 누르면 매번 숫자와 값이 바뀐 새 문제가 만들어져서 원하는 만큼 계속 연습할 수 있어요.
  정답 기록은 이 브라우저에만 저장돼요(localStorage). 언어·단원은 <code>js/data/</code> 폴더의 파일에 항목을 추가해 늘릴 수 있어요.
  <span aria-hidden="true"> · </span><a href="privacy.html">개인정보처리방침</a>
</footer>

<div class="modal-overlay" id="authOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <button class="modal-close" id="authClose" type="button" aria-label="닫기">×</button>
    <div class="auth-tabs">
      <button class="auth-tab" type="button" data-tab="login" aria-pressed="true">로그인</button>
      <button class="auth-tab" type="button" data-tab="signup" aria-pressed="false">회원가입</button>
    </div>
    <h2 class="auth-title" id="authTitle">로그인</h2>
    <p class="muted auth-note">이 계정은 이 브라우저 안에서만 동작하는 간단한 기능이에요. 다른 기기와 진도를 함께 보여주진 않지만, 한 기기를 여러 명이 쓸 때 진도를 서로 따로 기록할 수 있어요.</p>
    <form id="authForm" class="auth-form" autocomplete="on">
      <label>아이디
        <input type="text" id="authUsername" name="username" autocomplete="username" required minlength="2">
      </label>
      <label>비밀번호
        <input type="password" id="authPassword" name="password" autocomplete="current-password" required minlength="4">
      </label>
      <label id="authConfirmWrap" hidden>비밀번호 확인
      </label>
      <div class="auth-error" id="authError" hidden></div>
      <button class="btn" type="submit" id="authSubmit">로그인</button>
    </form>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/data/python.js"></script>
<script src="js/data/javascript.js"></script>
<script src="js/data/typescript.js"></script>
<script src="js/data/webpage.js"></script>
<script src="js/data/java.js"></script>
<script src="js/data/kotlin.js"></script>
<script src="js/data/c.js"></script>
<script src="js/data/unity.js"></script>
<script src="js/data/sql.js"></script>
<script src="js/app.js"></script>
<script src="js/minigames.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
