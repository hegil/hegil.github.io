<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드공방 — 프로그래밍 언어 학습</title>
<meta name="description" content="완전 처음 배우는 사람을 위한 프로그래밍 언어 학습 페이지. 무한 연습 문제 포함.">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #dfe3e8;
    --text: #1c2024;
    --text-dim: #5b6570;
    --accent: #3b6cf0;
    --accent-soft: #e8eefe;
    --ok: #17864b;
    --ok-soft: #e3f5ea;
    --bad: #c4342b;
    --bad-soft: #fdeae8;
    --code-bg: #1e2229;
    --code-text: #e6e9ef;
    --c-kw: #c792ea;
    --c-str: #a5d6a7;
    --c-num: #f5b97a;
    --c-com: #7f8a99;
    --c-fn: #82b8ff;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(20,25,35,.06), 0 6px 20px rgba(20,25,35,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a;
      --surface: #1a1e25;
      --surface-2: #22272f;
      --border: #2e343d;
      --text: #e7eaef;
      --text-dim: #9aa4b2;
      --accent: #6f97ff;
      --accent-soft: #1e2740;
      --ok: #5fd08a;
      --ok-soft: #16301f;
      --bad: #ff8a80;
      --bad-soft: #331c1a;
      --code-bg: #10131a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151a; --surface: #1a1e25; --surface-2: #22272f; --border: #2e343d;
    --text: #e7eaef; --text-dim: #9aa4b2; --accent: #6f97ff; --accent-soft: #1e2740;
    --ok: #5fd08a; --ok-soft: #16301f; --bad: #ff8a80; --bad-soft: #331c1a;
    --code-bg: #10131a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dfe3e8;
    --text: #1c2024; --text-dim: #5b6570; --accent: #3b6cf0; --accent-soft: #e8eefe;
    --ok: #17864b; --ok-soft: #e3f5ea; --bad: #c4342b; --bad-soft: #fdeae8;
    --code-bg: #1e2229; --shadow: 0 1px 2px rgba(20,25,35,.06), 0 6px 20px rgba(20,25,35,.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.7 -apple-system, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  code, pre, kbd { font-family: ui-monospace, SFMono-Regular, Consolas, "D2Coding", monospace; }
  a { color: var(--accent); }

  /* ---------- 헤더 ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .head-inner {
    max-width: 1120px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: -.01em; margin-right: auto; cursor: pointer; }
  .brand span { color: var(--accent); }
  .langbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .auth-area { display: flex; align-items: center; gap: 8px; }
  .user-greet { font-size: 14px; color: var(--text-dim); }
  .btn.small { padding: 6px 13px; font-size: 13.5px; border-radius: 999px; }
  .text-btn { border: 0; background: none; color: var(--text-dim); font: inherit; font-size: 13.5px; text-decoration: underline; cursor: pointer; padding: 0; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
    padding: 6px 13px; border-radius: 999px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    width: 36px; height: 36px; border-radius: 9px; cursor: pointer; font-size: 16px; line-height: 1;
  }
  .icon-btn:hover { border-color: var(--accent); }

  /* ---------- 레이아웃 ---------- */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; display: grid; gap: 28px; grid-template-columns: 250px 1fr; align-items: start; }
  .wrap.home-view { grid-template-columns: 1fr; max-width: 1000px; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }

  /* ---------- 사이드바 ---------- */
  aside { position: sticky; top: 78px; display: grid; gap: 16px; }
  aside[hidden] { display: none; }
  @media (max-width: 860px) { aside { position: static; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-pad { padding: 18px 20px; }
  .side-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); padding: 16px 18px 8px; }
  .unit-list { list-style: none; margin: 0; padding: 0 10px 12px; display: grid; gap: 2px; }
  .unit-btn {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 9px;
    border: 0; background: transparent; color: var(--text); font: inherit; font-size: 14.5px;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
  }
  .unit-btn:hover:not(:disabled) { background: var(--surface-2); }
  .unit-btn[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .unit-btn:disabled { color: var(--text-dim); cursor: not-allowed; opacity: .7; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: none; }
  .unit-btn.done .dot { background: var(--ok); }
  .soon { margin-left: auto; font-size: 11px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; color: var(--text-dim); }

  .progress-num { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
  .muted { color: var(--text-dim); font-size: 13.5px; }
  .reset { margin-top: 14px; background: none; border: 0; padding: 0; color: var(--text-dim); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }

  /* ---------- 본문 ---------- */
  .hero { margin-bottom: 22px; }
  .hero h1 { margin: 6px 0 6px; font-size: 30px; letter-spacing: -.02em; line-height: 1.3; }
  .eyebrow { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
  .hero p { margin: 0; color: var(--text-dim); }
  .goals { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .goals li { font-size: 13.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; }

  /* ---------- 홈 화면 ---------- */
  .home-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px 28px; margin-bottom: 26px; }
  .home-hero h1 { margin: 6px 0 10px; font-size: 28px; letter-spacing: -.02em; line-height: 1.35; }
  .home-hero p { margin: 0 0 16px; color: var(--text-dim); font-size: 15px; }
  .home-stat { display: inline-block; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 8px; }
  .lang-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .lang-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; cursor: pointer; transition: .15s; display: flex; flex-direction: column; }
  .lang-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .lang-card h3 { margin: 0 0 6px; font-size: 17px; }
  .lang-card p { margin: 0 0 12px; color: var(--text-dim); font-size: 13.5px; flex-grow: 1; }
  .lang-card-meta { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }
  .lang-card .btn { align-self: flex-start; }

  section.block { margin-bottom: 18px; }
  section.block > h2 { margin: 0; padding: 18px 20px 0; font-size: 18px; letter-spacing: -.01em; }
  section.block > .body { padding: 10px 20px 20px; }
  .body > p { margin: 0 0 12px; }
  .body > p:last-child { margin-bottom: 0; }
  .body ul { margin: 0 0 12px; padding-left: 20px; }
  .body li { margin-bottom: 5px; }
  .body table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-bottom: 12px; }
  .body th, .body td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .body th { color: var(--text-dim); font-weight: 600; font-size: 13px; }
  .body td code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 13.5px; }
  p code, li code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 14px; }
  .note {
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 14.5px;
  }
  .note b { color: var(--accent); }

  /* ---------- 코드 블록 ---------- */
  figure.code { margin: 0 0 14px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
  figure.code figcaption {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: rgba(255,255,255,.05); color: #b9c2cf;
    font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .copy {
    margin-left: auto; border: 1px solid rgba(255,255,255,.18); background: transparent;
    color: #cdd5e0; border-radius: 6px; padding: 3px 9px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .copy:hover { background: rgba(255,255,255,.1); }
  figure.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; color: var(--code-text); font-size: 14px; line-height: 1.65; }
  .out { border-top: 1px dashed rgba(255,255,255,.15); padding: 10px 16px 12px; color: #9aa4b2; font-size: 13.5px; white-space: pre-wrap; }
  .out b { color: #cdd5e0; font-weight: 600; display: block; margin-bottom: 3px; font-size: 12px; letter-spacing: .06em; }
  .preview { padding: 12px 16px 16px; border-top: 1px dashed rgba(255,255,255,.15); }
  .preview-label { color: #9aa4b2; font-size: 12px; letter-spacing: .06em; margin-bottom: 6px; display: block; }
  .preview iframe { display: block; width: 100%; height: 150px; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; background: #fff; }
  .tok-kw { color: var(--c-kw); }
  .tok-str { color: var(--c-str); }
  .tok-num { color: var(--c-num); }
  .tok-com { color: var(--c-com); font-style: italic; }
  .tok-fn { color: var(--c-fn); }

  /* ---------- 연습 문제 ---------- */
  .q { padding: 4px 20px 18px; }
  .q-head { display: flex; gap: 10px; font-weight: 600; margin-bottom: 12px; }
  .q-num { color: var(--accent); flex: none; }
  .q-text { font-weight: 600; }
  .q-text code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 14px; font-weight: 400; }
  .opts { display: grid; gap: 7px; }
  .opt {
    display: flex; align-items: flex-start; gap: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 10px 12px; font-size: 15px;
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin: 4px 0 0; accent-color: var(--accent); flex: none; }
  .opt code { font-size: 14px; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .blank-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .blank-row input[type=text] {
    flex: 1 1 160px; min-width: 0; font: inherit; font-family: ui-monospace, Consolas, monospace; font-size: 14.5px;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text);
  }
  .blank-row input:focus-visible, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .verdict { margin-top: 12px; font-size: 14.5px; padding: 10px 12px; border-radius: 8px; }
  .verdict.ok { background: var(--ok-soft); color: var(--ok); }
  .verdict.no { background: var(--bad-soft); color: var(--bad); }
  .verdict.ok::before { content: "정답이에요  "; font-weight: 700; }
  .verdict.no::before { content: "아쉬워요  "; font-weight: 700; }
  .quiz-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; color: var(--text-dim); }
  .stat b { color: var(--text); font-size: 15px; margin-right: 4px; }
  .stat.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; font-weight: 600; }
  .quiz-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); padding: 16px 20px; }
  .btn {
    border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    padding: 10px 18px; border-radius: 9px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  footer { max-width: 1120px; margin: 0 auto; padding: 0 20px 40px; color: var(--text-dim); font-size: 13.5px; }

  /* ---------- 로그인/회원가입 모달 ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,12,16,.5);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px 24px 24px; position: relative;
  }
  .modal-close {
    position: absolute; top: 14px; right: 14px; border: 0; background: none; color: var(--text-dim);
    font-size: 20px; line-height: 1; cursor: pointer; width: 28px; height: 28px; border-radius: 6px;
  }
  .modal-close:hover { background: var(--surface-2); color: var(--text); }
  .auth-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .auth-tab {
    flex: 1; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
    font: inherit; font-weight: 600; font-size: 14px; padding: 8px; border-radius: 8px; cursor: pointer;
  }
  .auth-tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .auth-title { margin: 0 0 6px; font-size: 20px; letter-spacing: -.01em; }
  .auth-note { margin: 0 0 18px; line-height: 1.6; }
  .auth-form { display: grid; gap: 14px; }
  .auth-form label { display: grid; gap: 6px; font-size: 13.5px; color: var(--text-dim); font-weight: 600; }
  .auth-form label[hidden] { display: none; }
  .auth-form input {
    font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 9px; background: var(--surface); color: var(--text);
  }
  .auth-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .auth-error { background: var(--bad-soft); color: var(--bad); font-size: 13.5px; padding: 9px 12px; border-radius: 8px; }
  .auth-form .btn { width: 100%; padding: 11px; font-size: 15px; }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand" id="brandHome" role="button" tabindex="0">코드<span>공방</span></div>
    <nav class="langbar" id="langbar" aria-label="학습 언어 선택"></nav>
    <div class="auth-area" id="authArea"></div>
    <button class="icon-btn" id="theme" type="button" aria-label="밝은/어두운 테마 전환">◐</button>
  </div>
</header>

<div class="wrap" id="wrap">
  <aside id="sidebar" hidden>
    <div class="card">
      <div class="side-title">단원</div>
      <ul class="unit-list" id="units"></ul>
    </div>
    <div class="card card-pad">
      <div class="muted">이 언어의 진도</div>
      <div class="progress-num" id="pct">0%</div>
      <div class="bar"><i id="barfill" style="width:0%"></i></div>
      <div class="muted" id="progress-note" style="margin-top:10px"></div>
      <button class="reset" id="reset" type="button">진도 초기화</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<footer>
  "다음 문제"를 누르면 매번 숫자와 값이 바뀐 새 문제가 만들어져서 원하는 만큼 계속 연습할 수 있어요.
  정답 기록은 이 브라우저에만 저장돼요(localStorage). 언어·단원은 <code>COURSES</code> 데이터에 항목을 추가해 늘릴 수 있어요.
</footer>

<div class="modal-overlay" id="authOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <button class="modal-close" id="authClose" type="button" aria-label="닫기">×</button>
    <div class="auth-tabs">
      <button class="auth-tab" type="button" data-tab="login" aria-pressed="true">로그인</button>
      <button class="auth-tab" type="button" data-tab="signup" aria-pressed="false">회원가입</button>
    </div>
    <h2 class="auth-title" id="authTitle">로그인</h2>
    <p class="muted auth-note">이 계정은 이 브라우저 안에서만 동작하는 간단한 기능이에요. 다른 기기와 진도를 함께 보여주진 않지만, 한 기기를 여러 명이 쓸 때 진도를 서로 따로 기록할 수 있어요.</p>
    <form id="authForm" class="auth-form" autocomplete="on">
      <label>아이디
        <input type="text" id="authUsername" autocomplete="username" required minlength="2">
      </label>
      <label>비밀번호
        <input type="password" id="authPassword" autocomplete="current-password" required minlength="4">
      </label>
      <label id="authConfirmWrap" hidden>비밀번호 확인
        <input type="password" id="authConfirm" autocomplete="new-password">
      </label>
      <div class="auth-error" id="authError" hidden></div>
      <button class="btn" type="submit" id="authSubmit">로그인</button>
    </form>
  </div>
</div>

<script>
/* =========================================================================
   0) 아주 작은 도우미 함수들
   ========================================================================= */
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[randInt(0, arr.length - 1)];
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* 객관식 문제 하나를 만들어 줌: 정답과 오답들을 무작위 순서로 섞음 */
function makeChoice(q, correct, distractors, why) {
  const opts = shuffle([correct, ...distractors]);
  return { type: 'choice', q, opts, answer: opts.indexOf(correct), why };
}

const STREAK_GOAL = 5; // 이만큼 연속 정답을 맞히면 그 단원이 "완료"로 표시됨

/* =========================================================================
   1) 강의 + 문제 데이터
   ---------------------------------------------------------------------
   언어를 추가하려면: COURSES에 키를 하나 더 만들고 units 배열을 채우면 됩니다.
   문제를 늘리려면: 각 단원의 quizGenerators 배열에 함수를 추가하세요.
   함수는 호출될 때마다 무작위 값으로 새 문제 객체를 만들어 돌려줘야 합니다.
   ========================================================================= */

const UPCOMING_CODE = [
  { id: 'oop', title: '클래스와 객체' },
  { id: 'error', title: '예외 처리' },
];

/* =========================================================================
   2) 문법 강조 (외부 라이브러리 없이 최소 구현)
   ========================================================================= */
const SYNTAX = {
  python:     { comment:'#[^\\n]*', keywords:['def','return','if','elif','else','for','while','in','not','and','or','import','from','as','class','True','False','None','print','input','int','float','str','bool','type','len','range'] },
  javascript: { comment:'//[^\\n]*|/\\*[\\s\\S]*?\\*/', keywords:['let','const','var','function','return','if','else','for','while','of','in','class','new','typeof','true','false','null','undefined','console'] },
  java:       { comment:'//[^\\n]*|/\\*[\\s\\S]*?\\*/', keywords:['public','private','protected','static','void','class','new','return','if','else','for','while','int','long','double','float','char','boolean','String','true','false','null','System'] },
  c:          { comment:'//[^\\n]*|/\\*[\\s\\S]*?\\*/', keywords:['include','int','float','double','char','void','return','if','else','for','while','sizeof','const','unsigned','struct','printf','scanf','main'] },
  sql:        { comment:'--[^\\n]*', keywords:['SELECT','FROM','WHERE','ORDER','BY','GROUP','JOIN','ON','ASC','DESC','LIMIT','AS','COUNT','SUM','AVG','MAX','MIN','AND','OR','NOT','IN','LIKE','NULL','INSERT','INTO','VALUES','UPDATE','DELETE','CREATE','TABLE'] }
};
const STRING_PAT = `"""[\\s\\S]*?"""|'''[\\s\\S]*?'''|\`(?:\\\\.|[^\`\\\\])*\`|"(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*'|<[a-z.]+\\.h>`;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escAttr = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');

function tokenize(code, re, classes) {
  let out = '', last = 0, m;
  while ((m = re.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    const gi = m.slice(1).findIndex(g => g !== undefined);
    out += `<span class="${classes[gi]}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

function highlight(code, lang) {
  if (lang === 'html') {
    const re = new RegExp('(\\x3C!--[\\s\\S]*?--\\x3E)|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')|(\\x3C\\/?[a-zA-Z][\\w-]*)|([a-zA-Z-]+(?=\\s*=))', 'g');
    return tokenize(code, re, ['tok-com', 'tok-str', 'tok-kw', 'tok-fn']);
  }
  if (lang === 'css') {
    const re = /(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|([.#]?[a-zA-Z][\w-]*(?=\s*\{)|[a-zA-Z-]+(?=\s*:))|(#[0-9a-fA-F]{3,6}\b|\b\d+(?:\.\d+)?(?:px|em|rem|%)?\b)/g;
    return tokenize(code, re, ['tok-com', 'tok-str', 'tok-kw', 'tok-num']);
  }
  const spec = SYNTAX[lang] || SYNTAX.python;
  const re = new RegExp(
    `(${spec.comment})|(${STRING_PAT})|(\\b(?:${spec.keywords.join('|')})\\b)` +
    `|(\\b\\d+(?:\\.\\d+)?[fLu]?\\b)|([A-Za-z_]\\w*(?=\\s*\\())`, 'g');
  return tokenize(code, re, ['tok-com', 'tok-str', 'tok-kw', 'tok-num', 'tok-fn']);
}

   3) 계정 (이 브라우저 안에서만 동작하는 간단한 로그인)
   ---------------------------------------------------------------------
   서버가 없는 정적 페이지라 진짜 보안 인증은 아니에요. 같은 기기를 여러 명이
   쓸 때 진도를 이름별로 나눠 기록하기 위한 가벼운 기능입니다.
   ========================================================================= */
const USERS_KEY = 'codelab.users';
const SESSION_KEY = 'codelab.session';

const loadUsers = () => { try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; } catch { return {}; } };
const saveUsers = u => { try { localStorage.setItem(USERS_KEY, JSON.stringify(u)); } catch {} };
const getCurrentUser = () => { try { return localStorage.getItem(SESSION_KEY) || null; } catch { return null; } };
const setCurrentUser = name => { try { name ? localStorage.setItem(SESSION_KEY, name) : localStorage.removeItem(SESSION_KEY); } catch {} };

async function hashPassword(pw) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch {
    let h = 0;
    for (let i = 0; i < pw.length; i++) h = (h * 31 + pw.charCodeAt(i)) | 0;
    return 'fallback-' + h.toString(16);
  }
}

async function signup(username, password) {
  username = username.trim();
  if (username.length < 2) return { ok: false, msg: '아이디는 2자 이상으로 입력해주세요.' };
  if (password.length < 4) return { ok: false, msg: '비밀번호는 4자 이상으로 입력해주세요.' };
  const users = loadUsers();
  if (users[username]) return { ok: false, msg: '이미 있는 아이디예요. 로그인을 눌러주세요.' };
  users[username] = { hash: await hashPassword(password), createdAt: Date.now() };
  saveUsers(users);
  return { ok: true, username };
}

async function login(username, password) {
  username = username.trim();
  const users = loadUsers();
  const rec = users[username];
  if (!rec || rec.hash !== await hashPassword(password)) {
    return { ok: false, msg: '아이디 또는 비밀번호가 올바르지 않아요.' };
  }
  return { ok: true, username };
}

  const course = COURSES[langKey];
  const u = course.units[unitIdx];
  el('main').innerHTML = `
    <div class="hero">
      <div class="eyebrow">${course.name} · ${unitIdx + 1}단원</div>
      <h1>${u.title}</h1>
      <p>${u.summary}</p>
      <ul class="goals">${u.goals.map(g => `<li>${g}</li>`).join('')}</ul>
    </div>
    ${u.blocks.map(b => `
      <section class="block card">
        <h2>${b.h}</h2>
        <div class="body">
          ${b.html}
          ${b.code ? codeFigure(b.code, langKey) : ''}
          ${b.after || ''}
        </div>
      </section>`).join('')}
    <section class="block card" id="quiz">
      <h2>연습 문제 <span class="muted" style="font-weight:400">· 계속 새 문제가 나와요</span></h2>
      <div class="body" style="padding-bottom:6px">
        <p class="muted" style="margin:0 0 12px">문제를 풀고 <b>확인하기</b>를 누르면 정답과 설명이 나와요. 다 봤으면 <b>다음 문제</b>를 눌러서 계속 연습하세요. 문제는 무한히 만들어져요.</p>
        <div class="quiz-stats" id="quiz-stats"></div>
      </div>
      <div id="qlist"></div>
      <div class="quiz-foot">
        <button class="btn" type="button" id="check">확인하기</button>
        <button class="btn ghost" type="button" id="next">다음 문제</button>
      </div>
    </section>`;
  newQuestion();
}

/* =========================================================================
   6) 무한 연습 문제: 생성 · 채점 · 기록
   ========================================================================= */
const norm = s => s.trim().replace(/\s+/g, '').toLowerCase();

function newQuestion() {
  const u = COURSES[langKey].units[unitIdx];
  currentQuestion = pick(u.quizGenerators)();
  el('qlist').innerHTML = quizItem(currentQuestion);
  el('check').disabled = false;
  el('check').textContent = '확인하기';
  renderStats();
}

function checkAnswer() {
  if (!currentQuestion) return;
  const q = currentQuestion;
  const box = document.querySelector('.q[data-q="0"]');
  const verdict = box.querySelector('.verdict');
  let ok = false;

  if (q.type === 'choice') {
    const chosen = box.querySelector('input[name="q0"]:checked');
    if (!chosen) {
      verdict.hidden = false;
      verdict.className = 'verdict no';
      verdict.textContent = '먼저 보기를 하나 골라주세요.';
      return;
    }
    ok = Number(chosen.value) === q.answer;
    box.querySelectorAll('.opt').forEach((lab, j) => {
      lab.classList.remove('correct', 'wrong');
      if (j === q.answer) lab.classList.add('correct');
      else if (Number(chosen.value) === j) lab.classList.add('wrong');
    });
  } else {
    const input = box.querySelector('input[name="q0"]');
    ok = q.accept.some(a => norm(a) === norm(input.value));
    input.style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
  }

  verdict.hidden = false;
  verdict.className = 'verdict ' + (ok ? 'ok' : 'no');
  verdict.innerHTML = q.why + (!ok && q.type === 'blank' ? ` (정답: <code>${esc(q.accept[0])}</code>)` : '');

  box.querySelectorAll('input').forEach(i => { i.disabled = true; });
  el('check').disabled = true;

  updateStreak(ok);
}

function updateStreak(ok) {
  const key = `${langKey}.${COURSES[langKey].units[unitIdx].id}`;
  const rec = progress[key] || { asked: 0, correct: 0, streak: 0, bestStreak: 0, done: false };
  rec.asked++;
  if (ok) { rec.correct++; rec.streak++; } else { rec.streak = 0; }
  rec.bestStreak = Math.max(rec.bestStreak, rec.streak);
  if (!rec.done && rec.bestStreak >= STREAK_GOAL) rec.done = true;
  progress[key] = rec;
  saveProgress(progress);
  renderUnits();
  renderStats();
}

function renderStats() {
  const key = `${langKey}.${COURSES[langKey].units[unitIdx].id}`;
  const rec = progress[key] || { asked: 0, correct: 0, streak: 0, bestStreak: 0, done: false };
  el('quiz-stats').innerHTML = `
    <span class="stat"><b>${rec.streak}</b>연속 정답</span>
    <span class="stat"><b>${rec.correct}</b>/${rec.asked} 맞음</span>
    <span class="stat"><b>${rec.bestStreak}</b>최고 기록</span>
    ${rec.done ? '<span class="stat done">단원 완료</span>' : ''}
  `;
  renderProgress();
}

/* =========================================================================
   7) 이벤트
   ========================================================================= */
document.addEventListener('click', async e => {
  if (e.target.closest('#brandHome')) { goHome(); return; }

  const chip = e.target.closest('.chip');
  if (chip) {
    if (chip.classList.contains('home-chip')) goHome();
    else goLesson(chip.dataset.lang, 0);
    return;
  }

  const gotoEl = e.target.closest('[data-goto]');
  if (gotoEl) { goLesson(gotoEl.dataset.goto, 0); return; }

  const unitBtn = e.target.closest('.unit-btn');
  if (unitBtn && !unitBtn.disabled) {
    unitIdx = Number(unitBtn.dataset.unit);
    renderUnits(); renderUnit();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (e.target.id === 'check') { checkAnswer(); return; }
  if (e.target.id === 'next') { newQuestion(); return; }

  if (e.target.classList.contains('copy')) {
    const code = e.target.closest('figure').querySelector('code').textContent;
    try { await navigator.clipboard.writeText(code); e.target.textContent = '복사됨'; }
    catch { e.target.textContent = '복사 실패'; }
    setTimeout(() => { e.target.textContent = '복사'; }, 1400);
    return;
  }
  if (e.target.id === 'reset') {
    const who = getCurrentUser() ? `${getCurrentUser()}님의` : '지금(비로그인) 이 브라우저의';
    if (confirm(`${who} 학습 진도를 모두 지울까요?`)) {
      progress = {}; saveProgress(progress); renderUnits(); renderStats();
    }
    return;
  }
  if (e.target.id === 'theme') {
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('codelab.theme', next); } catch {}
    return;
  }

  if (e.target.id === 'loginBtn') { openAuthModal('login'); return; }
  if (e.target.id === 'signupBtn') { openAuthModal('signup'); return; }
  if (e.target.id === 'logoutBtn') { setCurrentUser(null); refreshAfterAuthChange(); return; }
  if (e.target.id === 'authClose' || e.target.id === 'authOverlay') { closeAuthModal(); return; }
  if (e.target.classList.contains('auth-tab')) {
    authMode = e.target.dataset.tab;
    el('authError').hidden = true;
    updateAuthModeUI();
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('#qlist input[type="text"]')) {
    e.preventDefault();
    if (!el('check').disabled) el('check').click();
  }
  if (e.key === 'Escape' && !el('authOverlay').hidden) { closeAuthModal(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'brandHome') {
    e.preventDefault();
    goHome();
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'authForm') return;
  e.preventDefault();
  const username = el('authUsername').value;
  const password = el('authPassword').value;
  const errEl = el('authError');
  errEl.hidden = true;

  if (authMode === 'signup' && password !== el('authConfirm').value) {
    errEl.hidden = false;
    errEl.textContent = '비밀번호가 서로 달라요.';
    return;
  }

  el('authSubmit').disabled = true;
  const result = authMode === 'signup' ? await signup(username, password) : await login(username, password);
  el('authSubmit').disabled = false;

  if (!result.ok) {
    errEl.hidden = false;
    errEl.textContent = result.msg;
    return;
  }
  const wasGuestProgress = authMode === 'signup' && !getCurrentUser() ? progress : null;
  setCurrentUser(result.username);
  if (wasGuestProgress) saveProgress(wasGuestProgress);
  closeAuthModal();
  refreshAfterAuthChange();
});

/* 초기화 */
try {
  const saved = localStorage.getItem('codelab.theme');
  if (saved) document.documentElement.dataset.theme = saved;
} catch {}
renderAuthArea();
goHome();
</script>
</body>
</html>
